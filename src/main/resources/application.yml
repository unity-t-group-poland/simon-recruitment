server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: simon-recruitment
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:54329/simon_recruitment}
    username: ${DB_USER:recruitment}
    password: ${DB_PASSWORD:local-recruitment-only}
  jooq:
    sql-dialect: POSTGRES
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
